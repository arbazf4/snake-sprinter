<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Sprinter</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%8D%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at 50% 30%, #10281f, #060d0a 72%);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #e8f5e9;
            text-align: center;
        }

        .game {
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Safe centering: auto margins collapse when the content is taller
               than the viewport, so nothing gets clipped out of scroll reach. */
            margin: auto;
        }

        h1 {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 14px;
        }

        .word {
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #a8ff3e, #7cfc9c 50%, #40e0d0);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: glowPulse 2.4s ease-in-out infinite;
        }

        .logo {
            font-size: 2.1rem;
            animation: bob 2.2s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(124, 252, 156, 0.8));
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-4px); }
        }

        @keyframes glowPulse {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(124, 252, 156, 0.35)); }
            50%      { filter: drop-shadow(0 0 18px rgba(124, 252, 156, 0.65)); }
        }

        .hud {
            display: flex;
            justify-content: space-between;
            width: min(460px, 100%);
            margin-bottom: 10px;
            padding: 8px 14px;
            border: 1px solid rgba(124, 252, 156, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
            font-size: 1rem;
        }
        .hud span {
            color: #7cfc9c;
        }
        .hud .combo {
            color: #ffd54f;
        }

        #board {
            display: block;
            width: min(460px, 100%);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(124, 252, 156, 0.25),
                        0 0 0 2px rgba(124, 252, 156, 0.45);
            touch-action: none;
        }

        /* Touch controls — shown only on touch devices */
        .pad {
            display: none;
            margin-top: 14px;
            align-items: center;
            justify-content: center;
            gap: 20px;
            touch-action: manipulation;
        }
        @media (pointer: coarse) {
            .pad {
                display: flex;
            }
        }
        .pad-grid {
            display: grid;
            grid-template-columns: repeat(3, 54px);
            grid-template-rows: repeat(3, 54px);
            gap: 6px;
        }
        .dir,
        .pad-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 1px solid rgba(124, 252, 156, 0.4);
            border-bottom: 3px solid rgba(124, 252, 156, 0.35);
            background: linear-gradient(180deg, rgba(124, 252, 156, 0.18), rgba(124, 252, 156, 0.05));
            color: #d7ffe2;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: inherit;
            touch-action: manipulation;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }
        .dir {
            font-size: 1.3rem;
        }
        .pad-btn {
            min-width: 84px;
            padding: 0 14px;
            letter-spacing: 1px;
            color: #060d0a;
            background: linear-gradient(135deg, #a8ff3e, #40e0d0);
            border: none;
        }
        .dir:active,
        .pad-btn:active {
            transform: translateY(2px);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .controls {
            margin-top: 14px;
            color: #a5d6a7;
            font-size: 0.92rem;
            line-height: 1.9;
            max-width: 520px;
        }
        .controls b {
            color: #d7ffe2;
        }

        #restart-btn {
            margin-top: 12px;
            padding: 10px 26px;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: #060d0a;
            background: linear-gradient(135deg, #a8ff3e, #40e0d0);
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }
        #restart-btn:hover {
            box-shadow: 0 0 16px rgba(124, 252, 156, 0.8);
        }

        #mute-btn {
            position: fixed;
            top: 18px;
            right: 18px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid rgba(124, 252, 156, 0.4);
            background: rgba(255, 255, 255, 0.07);
            color: #7cfc9c;
            font-size: 1.3rem;
            cursor: pointer;
        }
        #mute-btn:hover {
            background: rgba(124, 252, 156, 0.15);
        }
    </style>
</head>
<body>
    <div class="game">
        <h1><span class="logo">🐍</span><span class="word">Snake Sprinter</span></h1>
        <div class="hud">
            <div>Score <span id="score">0</span></div>
            <div class="combo">Combo <span id="combo">×1</span></div>
            <div>Best <span id="highScore">0</span></div>
        </div>
        <canvas id="board" width="460" height="460" role="img" aria-label="Snake Sprinter game board"></canvas>
        <div class="pad">
            <div class="pad-grid">
                <span></span><button class="dir" id="dir-up" aria-label="Move up">▲</button><span></span>
                <button class="dir" id="dir-left" aria-label="Move left">◀</button><span></span><button class="dir" id="dir-right" aria-label="Move right">▶</button>
                <span></span><button class="dir" id="dir-down" aria-label="Move down">▼</button><span></span>
            </div>
            <button class="pad-btn" id="boost-btn" aria-label="Boost">BOOST</button>
        </div>
        <div class="controls">
            <p><b>Move</b>: arrows or WASD (swipe / D-pad on touch) &nbsp;·&nbsp; <b>Space</b> boost (hold) &nbsp;·&nbsp; <b>P</b> pause &nbsp;·&nbsp; <b>M</b> sound &nbsp;·&nbsp; <b>Enter</b> restart</p>
            <p>⭐ Double Points &nbsp;·&nbsp; 👻 Ghost Walls &nbsp;·&nbsp; 🐢 Slow Time</p>
        </div>
        <button id="restart-btn">Restart Game</button>
    </div>
    <button id="mute-btn" title="Toggle sound (M)"></button>

    <script>
        (function () {
            'use strict';

            // ---------------- Setup ----------------
            const canvas = document.getElementById('board');
            const ctx = canvas.getContext('2d');
            const GRID_SIZE = 20;
            const SEG = 23;                    // cell size in CSS px (460 / 20)
            const CENTER = canvas.width / 2;

            const scoreEl = document.getElementById('score');
            const comboEl = document.getElementById('combo');
            const highScoreEl = document.getElementById('highScore');
            const restartBtn = document.getElementById('restart-btn');
            const muteBtn = document.getElementById('mute-btn');

            // Safe storage access — persistence degrades gracefully when
            // localStorage is blocked (privacy mode, sandboxed file://, etc.).
            function storageGet(key, fallback) {
                try { return localStorage.getItem(key); }
                catch (e) { return fallback; }
            }
            function storageSet(key, value) {
                try { localStorage.setItem(key, value); }
                catch (e) { /* persistence unavailable — ignore */ }
            }

            // ---------------- Game state ----------------
            let snake = [];
            let prevSnake = null;               // positions before last tick (for interpolation)
            let direction = { x: 1, y: 0 };
            let directionQueue = [];
            let food = { x: 8, y: 8 };
            let special = null;                 // golden power-up food {x,y,type}
            let score = 0;
            let streak = 0;                     // foods eaten this run (drives combo + special spawns)
            let highScore = Number(storageGet('snakeHighScore', '0')) || 0;
            let running = false;
            let gameOver = false;
            let paused = false;
            let boosting = false;               // Space held → rocket boost
            let boostFuel = 100;                // 0..100 fuel meter for the boost

            const BASE_TICK = 170;
            const MIN_TICK = 68;
            const BOOST_FACTOR = 1.5;
            const BOOST_DRAIN = 34;             // fuel units drained per second while boosting
            const BOOST_REFILL = 20;            // fuel units recovered per second while not
            function baseTick() {
                return Math.max(MIN_TICK, BASE_TICK - (snake.length - 3) * 4);
            }
            function hasEffect(type) {
                return effects.some(e => e.type === type && e.timeLeft > 0);
            }
            // Boost only engages while the key is held AND there is fuel left.
            function boostingActive() {
                return boosting && boostFuel > 0;
            }
            function effectiveTick() {
                return baseTick() * (hasEffect('slow') ? 0.55 : 1) / (boostingActive() ? BOOST_FACTOR : 1);
            }

            let lastTick = 0;
            let lastFrame = 0;
            let acc = 0;
            let tickT = 0;                      // 0..1 motion progress inside current tick

            // ---------------- Visual effect state ----------------
            const particles = [];
            const flames = [];                  // rocket exhaust trail
            const popups = [];
            const effects = [];
            let shakeTime = 0;
            const SHAKE_MAX = 0.45;
            const ambient = [];
            for (let i = 0; i < 36; i++) {
                ambient.push({
                    x: Math.random() * 460, y: Math.random() * 460,
                    r: Math.random() * 1.6 + 0.5,
                    v: Math.random() * 14 + 4,     // px/s upward drift
                    a: Math.random() * 0.35 + 0.1
                });
            }

            const SPECIALS = [
                { type: 'double', emoji: '⭐', color: '#ffd54f', hint: 'Double Points', dur: 10000 },
                { type: 'ghost',  emoji: '👻', color: '#b388ff', hint: 'Ghost Walls',   dur: 8000  },
                { type: 'slow',   emoji: '🐢', color: '#4fc3f7', hint: 'Slow Time',     dur: 6000  }
            ];

            // ---------------- DOM ----------------
            highScoreEl.textContent = highScore;

            // ---------------- Audio (Web Audio, no assets) ----------------
            let AC = null, master = null, sfx = null, bgm = null;
            let muted = storageGet('snakeMuted', '0') === '1';
            let musicScheduled = 0, musicStep = 0;

            function updateMuteBtn() {
                muteBtn.textContent = muted ? '🔇' : '🔊';
            }
            updateMuteBtn();

            function ensureAudio() {
                if (AC) {
                    if (AC.state === 'suspended') AC.resume();
                    return;
                }
                try {
                    const Ctor = window.AudioContext || window.webkitAudioContext;
                    if (!Ctor) return;
                    AC = new Ctor();
                    master = AC.createGain();
                    master.gain.value = muted ? 0 : 1;
                    master.connect(AC.destination);
                    sfx = AC.createGain(); sfx.gain.value = 0.45; sfx.connect(master);
                    bgm = AC.createGain(); bgm.gain.value = 0.14;  bgm.connect(master);
                } catch (e) { /* audio unavailable; game still works */ }
            }

            function tone(freq, endFreq, dur, type, vol, when, dest) {
                if (!AC) return;
                const t0 = (when !== undefined ? when : AC.currentTime);
                const g = AC.createGain();
                const o = AC.createOscillator();
                o.type = type;
                o.frequency.setValueAtTime(freq, t0);
                if (endFreq && endFreq !== freq) {
                    o.frequency.exponentialRampToValueAtTime(Math.max(1, endFreq), t0 + dur);
                }
                g.gain.setValueAtTime(0, t0);
                g.gain.linearRampToValueAtTime(vol, t0 + 0.014);
                g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
                o.connect(g);
                g.connect(dest || sfx);
                o.start(t0);
                o.stop(t0 + dur + 0.05);
            }

            function sfxEat(streak) {
                if (!AC) return;
                tone(360 + Math.min(streak, 10) * 28, 640, 0.1, 'triangle', 0.5);
                tone(540 + Math.min(streak, 10) * 28, 900, 0.07, 'sine', 0.22, AC.currentTime + 0.03);
            }
            function sfxPower() {
                if (!AC) return;
                [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.14, 'sine', 0.4, AC.currentTime + i * 0.07));
            }
            function sfxGhostCloak() {
                if (!AC) return;
                [880, 660, 440, 330].forEach((f, i) => tone(f, f * 1.02, 0.18, 'triangle', 0.3, AC.currentTime + i * 0.05));
            }
            function sfxDie() {
                if (!AC) return;
                tone(320, 46, 0.7, 'sawtooth', 0.5);
                tone(160, 30, 0.8, 'triangle', 0.4, AC.currentTime + 0.05);
            }

            // Gentle generative loop: A minor → F → C → G with soft bass + arpeggio.
            const BARS = [
                { root: 110, chord: [220, 261.63, 329.63] },
                { root: 87.31, chord: [174.61, 220, 261.63] },
                { root: 130.81, chord: [261.63, 329.63, 392.0] },
                { root: 98, chord: [196, 246.94, 293.66] }
            ];
            const BEAT = 0.42;   // seconds per beat

            function scheduleMusic() {
                if (!AC || muted) return;
                // Resume from "now": skip any backlog that built up while muted
                // or while the tab was hidden, so resuming never replays a burst.
                musicScheduled = Math.max(musicScheduled, AC.currentTime);
                const ahead = AC.currentTime + 0.2;
                while (musicScheduled < ahead) {
                    const bar = Math.floor(musicStep / 16) % 4;
                    const s = musicStep % 16;
                    const t = musicScheduled;
                    if (s % 4 === 0) {
                        tone(BARS[bar].root, BARS[bar].root, BEAT * 0.85, 'triangle', 0.5, t, bgm);
                    }
                    const ch = BARS[bar].chord;
                    const note = ch[(s >> 1) % 3] * (s % 4 === 0 ? 2 : 1);
                    tone(note, note, 0.16, 'sine', 0.12, t + 0.005, bgm);
                    musicScheduled += BEAT / 4;
                    musicStep++;
                }
            }

            function toggleMute() {
                muted = !muted;
                storageSet('snakeMuted', muted ? '1' : '0');
                if (master) master.gain.value = muted ? 0 : 1;
                updateMuteBtn();
            }

            // ---------------- Helpers ----------------
            function rand(max) { return Math.floor(Math.random() * max); }
            function cellEq(a, b) { return a.x === b.x && a.y === b.y; }

            function freeCells(exclude) {
                const taken = new Set(snake.map(s => s.y * GRID_SIZE + s.x));
                if (exclude) taken.add(exclude.y * GRID_SIZE + exclude.x);
                const free = [];
                for (let y = 0; y < GRID_SIZE; y++) {
                    for (let x = 0; x < GRID_SIZE; x++) {
                        if (!taken.has(y * GRID_SIZE + x)) free.push({ x, y });
                    }
                }
                return free;
            }

            function spawnFood() {
                // Pick from the actual free cells, so spawning always terminates
                // even on a nearly-full board (no unbounded random retries).
                const free = freeCells();
                if (free.length) food = free[rand(free.length)];
            }

            function spawnSpecial() {
                const entry = SPECIALS[rand(SPECIALS.length)];
                const free = freeCells(food);   // exclude the normal food too
                if (!free.length) return;
                const p = free[rand(free.length)];
                special = { x: p.x, y: p.y, type: entry.type, entry: entry };
            }

            function addEffect(type, entry) {
                const existing = effects.find(e => e.type === type);
                if (existing) existing.timeLeft = entry.dur;
                else effects.push({ type, timeLeft: entry.dur });
                if (type === 'ghost') sfxGhostCloak(); else sfxPower();
            }

            function burst(x, y, color, count, speed) {
                for (let i = 0; i < count; i++) {
                    const ang = Math.random() * Math.PI * 2;
                    const sp = (Math.random() * 0.8 + 0.35) * speed;
                    particles.push({
                        x, y,
                        vx: Math.cos(ang) * sp,
                        vy: Math.sin(ang) * sp,
                        life: Math.random() * 420 + 320,
                        maxLife: 740,
                        size: Math.random() * 3.5 + 1.5,
                        color
                    });
                }
            }

            function popup(x, y, text, color) {
                popups.push({ x, y, text, color, life: 850, maxLife: 850 });
            }

            // Interpolated pixel position of the tail (where the rocket exhaust streams from)
            function tailPos() {
                const n = snake.length - 1;
                const b = snake[n];
                const a = prevSnake && prevSnake[Math.min(n, prevSnake.length - 1)];
                const t = gameOver ? 1 : tickT;
                return {
                    x: (a ? a.x + (b.x - a.x) * t : b.x) * SEG + SEG / 2,
                    y: (a ? a.y + (b.y - a.y) * t : b.y) * SEG + SEG / 2
                };
            }

            // ---------------- Reset / start ----------------
            function setupBoard() {
                snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
                prevSnake = snake.map(c => ({ ...c }));
                direction = { x: 1, y: 0 };
                directionQueue = [];
                score = 0;
                streak = 0;
                gameOver = false;
                paused = false;
                running = false;
                acc = 0;
                lastTick = 0;   // re-anchor the clock on every (re)start
                tickT = 0;
                scoreEl.textContent = score;
                comboEl.textContent = '×1';
                spawnFood();
                special = null;
                effects.length = 0;
                particles.length = 0;
                flames.length = 0;
                popups.length = 0;
                boosting = false;
                boostFuel = 100;
            }

            function resetGame() {
                setupBoard();
                running = true;
            }

            function beginIfIdle() {
                if (!running && !gameOver) {
                    running = true;
                }
            }

            // Tapping/clicking the board resumes from pause or starts the game —
            // touch devices have no P key or Space after an auto-pause.
            function handleBoardTap() {
                ensureAudio();
                if (paused) paused = false;
                else if (!running && !gameOver) running = true;
            }

            // ---------------- Input ----------------
            function setDirection(next) {
                const ref = directionQueue.length ? directionQueue[directionQueue.length - 1] : direction;
                if (ref.x === -next.x && ref.y === -next.y) return;
                if (directionQueue.length < 2) directionQueue.push(next);
            }

            function handleKey(key, e) {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(key) && e) {
                    e.preventDefault();
                }
                let moved = false;
                switch (key) {
                    case 'ArrowUp': case 'w': case 'W':
                        setDirection({ x: 0, y: -1 }); moved = true; break;
                    case 'ArrowDown': case 's': case 'S':
                        setDirection({ x: 0, y: 1 }); moved = true; break;
                    case 'ArrowLeft': case 'a': case 'A':
                        setDirection({ x: -1, y: 0 }); moved = true; break;
                    case 'ArrowRight': case 'd': case 'D':
                        setDirection({ x: 1, y: 0 }); moved = true; break;
                    case ' ':
                        if (gameOver) { resetGame(); }
                        else if (!running) { running = true; }
                        boosting = true;
                        break;
                    case 'p': case 'P':
                        if (running && !gameOver) paused = !paused;
                        break;
                    case 'Enter':
                        if (gameOver || !running) resetGame();
                        break;
                    case 'm': case 'M':
                        toggleMute();
                        break;
                }
                if (moved) beginIfIdle();
            }

            document.addEventListener('keydown', (e) => {
                ensureAudio();
                handleKey(e.key, e);
            });
            document.addEventListener('keyup', (e) => {
                if (e.key === ' ') { e.preventDefault(); boosting = false; }
            });
            // If the window loses focus, a Space keyup can be missed — don't leave
            // the snake stuck in a boost, and pause so it can't die unattended.
            // Mobile browsers report backgrounding via visibilitychange, not blur.
            function lostFocus() {
                boosting = false;
                if (running && !paused && !gameOver) paused = true;
            }
            window.addEventListener('blur', lostFocus);
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) lostFocus();
            });
            restartBtn.addEventListener('click', () => { ensureAudio(); resetGame(); });
            muteBtn.addEventListener('click', () => { ensureAudio(); toggleMute(); });

            // ---------------- Touch / on-screen controls (mobile) ----------------
            function bindTouchControls() {
                const dirMap = {
                    'dir-up': { x: 0, y: -1 },
                    'dir-down': { x: 0, y: 1 },
                    'dir-left': { x: -1, y: 0 },
                    'dir-right': { x: 1, y: 0 }
                };
                Object.keys(dirMap).forEach(id => {
                    const btn = document.getElementById(id);
                    if (!btn) return;
                    btn.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        ensureAudio();
                        setDirection(dirMap[id]);
                        beginIfIdle();
                    });
                });

                const boostBtn = document.getElementById('boost-btn');
                const releaseBoost = () => { boosting = false; };
                if (boostBtn) {
                    boostBtn.addEventListener('pointerdown', (e) => {
                        e.preventDefault();
                        ensureAudio();
                        if (gameOver) resetGame();
                        else if (!running) running = true;
                        boosting = true;
                    });
                    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev =>
                        boostBtn.addEventListener(ev, releaseBoost));
                }

                // Swipe on the board to steer; a short tap interacts with overlays
                if (canvas.addEventListener) {
                    let start = null;
                    const SWIPE_MIN = 24;   // px before a swipe counts
                    canvas.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        const t = e.touches[0];
                        start = { x: t.clientX, y: t.clientY };
                    }, { passive: false });
                    canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
                    canvas.addEventListener('touchcancel', () => { start = null; }, { passive: false });
                    canvas.addEventListener('touchend', (e) => {
                        if (!start) return;
                        const t = e.changedTouches[0];
                        const dx = t.clientX - start.x, dy = t.clientY - start.y;
                        start = null;
                        if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) {
                            handleBoardTap();
                            return;
                        }
                        ensureAudio();
                        if (Math.abs(dx) > Math.abs(dy)) setDirection({ x: dx > 0 ? 1 : -1, y: 0 });
                        else setDirection({ x: 0, y: dy > 0 ? 1 : -1 });
                        beginIfIdle();
                    });
                    // Mouse click on the board (touch taps stay above — touchstart
                    // is preventDefaulted, so no synthetic click fires).
                    canvas.addEventListener('click', handleBoardTap);
                }
            }
            bindTouchControls();

            // ---------------- Update ----------------
            function update() {
                if (directionQueue.length) direction = directionQueue.shift();

                const head = snake[0];
                let newHead = { x: head.x + direction.x, y: head.y + direction.y };

                // Wall collision — ghost mode wraps around the edges.
                const ghost = hasEffect('ghost');
                if (newHead.x < 0 || newHead.x >= GRID_SIZE ||
                    newHead.y < 0 || newHead.y >= GRID_SIZE) {
                    if (ghost) {
                        newHead = {
                            x: (newHead.x + GRID_SIZE) % GRID_SIZE,
                            y: (newHead.y + GRID_SIZE) % GRID_SIZE
                        };
                    } else {
                        return endGame();
                    }
                }

                const eatingFood = cellEq(newHead, food);
                const eatingSpecial = special && cellEq(newHead, special);
                const bodyToCheck = (eatingFood || eatingSpecial) ? snake : snake.slice(0, -1);
                if (bodyToCheck.some(s => cellEq(s, newHead))) return endGame();

                snake.unshift(newHead);

                if (eatingSpecial) {
                    const entry = special.entry;
                    streak++;
                    const mult = Math.min(streak, 8);
                    // Award points BEFORE the effect activates, so a double-points
                    // star doesn't double its own pickup award.
                    const pts = 40 * mult * (hasEffect('double') ? 2 : 1);
                    addEffect(entry.type, entry);
                    special = null;
                    score += pts;
                    popup(newHead.x * SEG + SEG / 2, newHead.y * SEG, entry.emoji + ' +' + pts, entry.color);
                    burst(newHead.x * SEG + SEG / 2, newHead.y * SEG + SEG / 2, entry.color, 22, 0.9);
                } else if (eatingFood) {
                    streak++;
                    const mult = Math.min(streak, 8);
                    const basePts = 10 * mult;
                    const pts = basePts * (hasEffect('double') ? 2 : 1);
                    score += pts;
                    sfxEat(streak);
                    popup(newHead.x * SEG + SEG / 2, newHead.y * SEG, '+' + pts, hasEffect('double') ? '#ffd54f' : '#7cfc9c');
                    burst(newHead.x * SEG + SEG / 2, newHead.y * SEG + SEG / 2,
                          hasEffect('double') ? '#ffd54f' : '#7cfc9c', 14, 0.55);
                    spawnFood();
                    if (streak > 0 && streak % 5 === 0 && !special) spawnSpecial();
                } else {
                    snake.pop();
                }

                // Persist a new best however the points were earned (food or power-up).
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    storageSet('snakeHighScore', String(highScore));
                }

                scoreEl.textContent = score;
                comboEl.textContent = '×' + Math.min(streak || 1, 8);
            }

            function endGame() {
                gameOver = true;
                running = false;
                shakeTime = SHAKE_MAX;
                sfxDie();
            }

            function updateFx(dtMs) {
                const dt = dtMs / 1000;
                // Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.life -= dtMs;
                    if (p.life <= 0) { particles.splice(i, 1); continue; }
                    p.x += p.vx * dt * 60;
                    p.y += p.vy * dt * 60;
                    p.vx *= Math.pow(0.82, dt * 60);
                    p.vy *= Math.pow(0.82, dt * 60);
                }
                // Rocket exhaust trail (swell and fade as they cool)
                for (let i = flames.length - 1; i >= 0; i--) {
                    const f = flames[i];
                    f.life -= dtMs;
                    if (f.life <= 0) { flames.splice(i, 1); continue; }
                    f.x += f.vx * dt;
                    f.y += f.vy * dt;
                    f.size += 24 * dt;
                }
                // Floating score popups
                for (let i = popups.length - 1; i >= 0; i--) {
                    const p = popups[i];
                    p.life -= dtMs;
                    p.y -= 34 * dt;
                    if (p.life <= 0) popups.splice(i, 1);
                }
                // Screen shake decay
                shakeTime = Math.max(0, shakeTime - dt);
                // Ambient drift
                for (const a of ambient) {
                    a.y -= a.v * dt;
                    if (a.y < -4) { a.y = 464; a.x = Math.random() * 460; }
                }
                // Spawn rocket flames at the tail while boosting
                if (boostingActive() && running && !paused && !gameOver && snake.length) {
                    for (let k = 0; k < 2; k++) {
                        const tp = tailPos();
                        const sp = 150 + Math.random() * 130;
                        flames.push({
                            x: tp.x, y: tp.y,
                            vx: -direction.x * sp + (Math.random() - 0.5) * 70,
                            vy: -direction.y * sp + (Math.random() - 0.5) * 70,
                            life: Math.random() * 180 + 120,
                            maxLife: 300,
                            size: Math.random() * 3 + 1.5
                        });
                    }
                }
                // Boost fuel + effect timers (both pause together with the game)
                if (!paused && !gameOver) {
                    if (boostingActive()) boostFuel = Math.max(0, boostFuel - BOOST_DRAIN * dt);
                    else boostFuel = Math.min(100, boostFuel + BOOST_REFILL * dt);
                    for (let i = effects.length - 1; i >= 0; i--) {
                        effects[i].timeLeft -= dtMs;
                        if (effects[i].timeLeft <= 0) effects.splice(i, 1);
                    }
                }
            }

            // ---------------- Rendering ----------------
            function roundRect(x, y, w, h, r) {
                const rr = Math.min(r, w / 2, h / 2);
                ctx.beginPath();
                ctx.moveTo(x + rr, y);
                ctx.arcTo(x + w, y, x + w, y + h, rr);
                ctx.arcTo(x + w, y + h, x, y + h, rr);
                ctx.arcTo(x, y + h, x, y, rr);
                ctx.arcTo(x, y, x + w, y, rr);
                ctx.closePath();
            }

            function drawPanel(w, h, a = 0.9) {
                const x = (460 - w) / 2, y = (460 - h) / 2;
                ctx.fillStyle = `rgba(6, 13, 9, ${a})`;
                roundRect(x, y, w, h, 18);
                ctx.fill();
                ctx.strokeStyle = 'rgba(124, 252, 156, 0.4)';
                ctx.lineWidth = 2;
                ctx.stroke();
                return { x, y, w, h };
            }

            function tintWash(color) {
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, 460, 460);
            }

            function drawStar(cx, cy, inner, outer, points) {
                for (let i = 0; i < points * 2; i++) {
                    const r = i % 2 === 0 ? outer : inner;
                    const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
                    const x = cx + Math.cos(a) * r;
                    const y = cy + Math.sin(a) * r;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.closePath();
            }

            function draw() {
                const t = gameOver ? 1 : tickT;

                ctx.save();
                // Screen shake offsets the entire board
                if (shakeTime > 0) {
                    const k = (shakeTime / SHAKE_MAX) * 11;
                    ctx.translate((Math.random() * 2 - 1) * k, (Math.random() * 2 - 1) * k);
                }

                // Background
                const bg = ctx.createLinearGradient(0, 0, 0, 460);
                bg.addColorStop(0, '#0d2018');
                bg.addColorStop(1, '#07110d');
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, 460, 460);

                // Ambient drifting dust
                for (const a of ambient) {
                    ctx.globalAlpha = a.a;
                    ctx.fillStyle = '#7cfc9c';
                    ctx.beginPath();
                    ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                // Effect washes
                if (hasEffect('double')) tintWash('rgba(255, 213, 79, 0.05)');
                if (hasEffect('slow'))   tintWash('rgba(79, 195, 247, 0.05)');
                if (hasEffect('ghost'))  tintWash('rgba(179, 136, 255, 0.06)');

                // Boost fuel bar + effect timer bars — drawn before the gameplay
                // elements so they never cover the snake when it crosses the top.
                const fuelFrac = Math.max(0, boostFuel / 100);
                ctx.fillStyle = 'rgba(0,0,0,0.55)';
                roundRect(10, 10, 120, 7, 4);
                ctx.fill();
                ctx.fillStyle = fuelFrac > 0.25 ? '#7cfc9c' : '#ff5252';
                roundRect(10, 10, 120 * fuelFrac, 7, 4);
                ctx.fill();
                ctx.fillStyle = '#a5d6a7';
                ctx.font = '10px "Segoe UI", sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText('BOOST', 10, 27);

                if (effects.length) {
                    for (let i = 0; i < effects.length; i++) {
                        const e = effects[i];
                        const frac = e.timeLeft / (e.type === 'double' ? 10000 : e.type === 'ghost' ? 8000 : 6000);
                        const color = e.type === 'double' ? '#ffd54f' : e.type === 'ghost' ? '#b388ff' : '#4fc3f7';
                        const w = 96, h = 7;
                        const x = 10 + i * (w + 10), y = 30;
                        ctx.fillStyle = 'rgba(0,0,0,0.55)';
                        roundRect(x, y, w, h, 4);
                        ctx.fill();
                        ctx.fillStyle = color;
                        roundRect(x, y, w * frac, h, 4);
                        ctx.fill();
                    }
                }

                // Normal food (pulsing orb)
                const pulse = (Math.sin(performance.now() / 180) + 1) / 2;
                ctx.fillStyle = '#ff5252';
                ctx.shadowColor = '#ff5252';
                ctx.shadowBlur = 16;
                ctx.beginPath();
                ctx.arc(food.x * SEG + SEG / 2, food.y * SEG + SEG / 2, 5.5 + pulse * 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(food.x * SEG + SEG / 2, food.y * SEG + SEG / 2, (5.5 + pulse * 2.5) * 0.45, 0, Math.PI * 2);
                ctx.fillStyle = '#ffb3b3';
                ctx.fill();
                ctx.shadowBlur = 0;

                // Special power-up (spinning star)
                if (special) {
                    const sp = special.entry;
                    const cx = special.x * SEG + SEG / 2, cy = special.y * SEG + SEG / 2;
                    const rot = performance.now() / 260;
                    ctx.save();
                    ctx.translate(cx, cy);
                    ctx.rotate(rot);
                    ctx.fillStyle = sp.color;
                    ctx.shadowColor = sp.color;
                    ctx.shadowBlur = 18;
                    drawStar(0, 0, 4.2 + pulse * 2, 9.5, 5);
                    ctx.fill();
                    ctx.restore();
                    ctx.shadowBlur = 0;
                }

                // ---- Rocket tail flame (while boosting) ----
                if (boostingActive() && running && !paused && !gameOver) {
                    // Flickering teardrop flame at the tail
                    const tp = tailPos();
                    const bx = -direction.x, by = -direction.y;
                    const len = (11 + snake.length * 0.35) * (0.7 + Math.random() * 0.6);
                    const w = 4.5 + Math.random() * 2.5;
                    const tipX = tp.x + bx * len, tipY = tp.y + by * len;
                    const grad = ctx.createLinearGradient(tp.x, tp.y, tipX, tipY);
                    grad.addColorStop(0, 'rgba(255,255,255,0.95)');
                    grad.addColorStop(0.35, 'rgba(255,213,79,0.95)');
                    grad.addColorStop(0.75, 'rgba(255,87,34,0.7)');
                    grad.addColorStop(1, 'rgba(255,40,10,0)');
                    ctx.fillStyle = grad;
                    ctx.shadowColor = '#ff7a1a';
                    ctx.shadowBlur = 14;
                    ctx.beginPath();
                    ctx.moveTo(tp.x - direction.y * w, tp.y + direction.x * w);
                    ctx.lineTo(tp.x + direction.y * w, tp.y - direction.x * w);
                    ctx.lineTo(tipX, tipY);
                    ctx.closePath();
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // Rocket embers drifting back from the tail
                for (const f of flames) {
                    const a = Math.max(0, f.life / f.maxLife);
                    ctx.globalAlpha = a;
                    ctx.fillStyle = `hsl(${18 + a * 16}, 100%, ${52 + a * 20}%)`;
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                // Snake body (interpolated around corners for smooth motion)
                const ghost = hasEffect('ghost');
                for (let i = snake.length - 1; i >= 0; i--) {
                    const b = snake[i];
                    const a = prevSnake && prevSnake[Math.min(i, prevSnake.length - 1)];
                    const px = (a ? a.x + (b.x - a.x) * t : b.x) * SEG;
                    const py = (a ? a.y + (b.y - a.y) * t : b.y) * SEG;
                    const prog = i / Math.max(snake.length - 1, 1);

                    if (i === 0) {
                        ctx.shadowColor = '#7cfc9c';
                        ctx.shadowBlur = 16;
                    } else {
                        ctx.shadowBlur = 0;
                    }

                    const hue = 96 - prog * 46;      // lime → teal toward tail
                    const light = 62 - prog * 16;
                    ctx.globalAlpha = ghost ? 0.5 : 1;
                    ctx.fillStyle = `hsl(${hue}, 90%, ${light}%)`;
                    roundRect(px + 2, py + 2, SEG - 4, SEG - 4, 7);
                    ctx.fill();
                    ctx.globalAlpha = 1;

                    if (i === 0) {
                        // Head shine
                        ctx.fillStyle = 'rgba(255,255,255,0.35)';
                        roundRect(px + 5, py + 5, (SEG - 4) * 0.4, (SEG - 4) * 0.3, 4);
                        ctx.fill();
                    }
                }
                ctx.shadowBlur = 0;

                // Eyes on the head
                if (snake.length) {
                    const b = snake[0];
                    const a = prevSnake && prevSnake[0];
                    const cx = (a ? a.x + (b.x - a.x) * t : b.x) * SEG + SEG / 2;
                    const cy = (a ? a.y + (b.y - a.y) * t : b.y) * SEG + SEG / 2;
                    const fx = direction.x * 3, fy = direction.y * 3;
                    const px = direction.y, py = -direction.x;
                    const off = 3.6;
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    [1, -1].forEach(s => ctx.arc(cx + fx + px * off * s, cy + fy + py * off * s, 3.1, 0, Math.PI * 2));
                    ctx.fill();
                    ctx.fillStyle = '#0b120b';
                    ctx.beginPath();
                    [1, -1].forEach(s => ctx.arc(cx + fx + px * off * s, cy + fy + py * off * s, 1.6, 0, Math.PI * 2));
                    ctx.fill();
                }

                // Floating particles
                for (const p of particles) {
                    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * (0.5 + 0.5 * (p.life / p.maxLife)), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                ctx.restore();

                // ---------------- Popups & overlays (unshaken) ----------------
                for (const p of popups) {
                    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
                    ctx.fillStyle = p.color;
                    ctx.font = 'bold 19px "Segoe UI", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(p.text, p.x, p.y);
                }
                ctx.globalAlpha = 1;

                // Vignette
                const vg = ctx.createRadialGradient(CENTER, CENTER, 120, CENTER, CENTER, 340);
                vg.addColorStop(0, 'rgba(0,0,0,0)');
                vg.addColorStop(1, 'rgba(0,0,0,0.45)');
                ctx.fillStyle = vg;
                ctx.fillRect(0, 0, 460, 460);

                if (gameOver) {
                    const box = drawPanel(300, 210, 0.92);
                    const flash = (Math.sin(performance.now() / 120) + 1) / 2;
                    ctx.textAlign = 'center';
                    ctx.fillStyle = `rgba(255, 82, 82, ${0.75 + flash * 0.25})`;
                    ctx.font = 'bold 40px "Segoe UI", sans-serif';
                    ctx.fillText('GAME OVER', CENTER, box.y + 62);
                    ctx.fillStyle = '#e8f5e9';
                    ctx.font = '21px "Segoe UI", sans-serif';
                    ctx.fillText('Score  ' + score, CENTER, box.y + 104);
                    ctx.fillStyle = '#ffd54f';
                    ctx.font = '16px "Segoe UI", sans-serif';
                    ctx.fillText('Best ' + highScore + '   ·   Combo ×' + Math.min(streak || 1, 8), CENTER, box.y + 134);
                    ctx.fillStyle = '#a5d6a7';
                    ctx.font = '15px "Segoe UI", sans-serif';
                    ctx.fillText('Space / Enter or tap Restart', CENTER, box.y + 172);
                } else if (paused) {
                    const box = drawPanel(220, 120, 0.9);
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#ffd54f';
                    ctx.font = 'bold 36px "Segoe UI", sans-serif';
                    ctx.fillText('PAUSED', CENTER, box.y + 52);
                    ctx.fillStyle = '#a5d6a7';
                    ctx.font = '15px "Segoe UI", sans-serif';
                    ctx.fillText('Tap the board or press P', CENTER, box.y + 84);
                } else if (!running) {
                    drawPanel(320, 170, 0.9);
                    ctx.textAlign = 'center';
                    const breathe = 0.85 + 0.15 * Math.sin(performance.now() / 500);
                    ctx.save();
                    ctx.translate(CENTER, 150);
                    ctx.scale(breathe, breathe);
                    ctx.fillStyle = '#7cfc9c';
                    ctx.font = 'bold 34px "Segoe UI", sans-serif';
                    ctx.shadowColor = '#7cfc9c';
                    ctx.shadowBlur = 22;
                    ctx.fillText('🐍', 0, 0);
                    ctx.restore();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#e8f5e9';
                    ctx.font = 'bold 24px "Segoe UI", sans-serif';
                    ctx.fillText('SNAKE SPRINTER', CENTER, 212);
                    ctx.fillStyle = '#a5d6a7';
                    ctx.font = '17px "Segoe UI", sans-serif';
                    ctx.fillText('Tap or press an arrow key to start', CENTER, 262);
                    ctx.fillStyle = '#7d9c86';
                    ctx.font = '14px "Segoe UI", sans-serif';
                    ctx.fillText('or swipe / tap Space', CENTER, 290);
                }
            }

            // ---------------- Main loop ----------------
            function loop(ts) {
                requestAnimationFrame(loop);

                const dtMs = lastFrame ? Math.max(0, Math.min(ts - lastFrame, 100)) : 0;
                lastFrame = ts;

                updateFx(dtMs);
                if (AC) scheduleMusic();

                if (running && !paused && !gameOver) {
                    if (!lastTick) lastTick = ts;
                    // Cap the per-frame delta so a pause, restart, or returning from a
                    // background tab can't dump hours of stale time into the accumulator.
                    acc += Math.min(ts - lastTick, 100);
                    lastTick = ts;
                    const tick = effectiveTick();
                    while (acc >= tick) {
                        prevSnake = snake.map(c => ({ ...c }));
                        update();
                        if (gameOver) break;
                        acc -= tick;
                    }
                    tickT = Math.min(acc / tick, 1);
                } else {
                    lastTick = 0;   // re-anchor the game clock when not accumulating
                }

                draw();
            }

            let currentDpr = 1;
            function setupHiDPI() {
                const dpr = window.devicePixelRatio || 1;
                const size = 460;
                canvas.style.width = size + 'px';
                canvas.style.height = size + 'px';
                canvas.width = size * dpr;
                canvas.height = size * dpr;
                ctx.scale(dpr, dpr);
                currentDpr = dpr;
            }
            // Re-sharpen if the window moves between monitors with a different DPR
            // (guarded so ordinary resizes don't reset the canvas).
            window.addEventListener('resize', () => {
                const dpr = window.devicePixelRatio || 1;
                if (dpr !== currentDpr) setupHiDPI();
            });

            function init() {
                setupHiDPI();
                setupBoard();
                requestAnimationFrame(loop);
            }

            init();
        })();
    </script>
</body>
</html>
